---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-macos:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Verify Swift version
        run: |
          version="$(swift --version 2>&1)"
          echo "$version"
          echo "$version" | grep -qE 'Swift version 6\.4(\.[0-9]+)?([[:space:]]|$)' || { echo "::error::Expected Swift 6.4.x"; exit 1; }
      - name: Build (macOS)
        run: swift build --build-system swiftbuild --build-tests -v
      - name: Test (macOS)
        run: swift test --build-system swiftbuild -v --skip-build

  build-ios:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      # Xcode 16+ ships platform SDKs as on-demand components, so a freshly
      # rotated runner image can have the selected Xcode without the iOS
      # platform installed — `-destination 'generic/platform=iOS'` then resolves
      # to zero destinations ("iOS … is not installed") before anything
      # compiles. Fetch the component when it is missing. This is best-effort
      # (`|| true`): on images that already have the platform the download itself
      # can error ("Unable to connect to simulator"), and the Build step below is
      # the real gate either way — it only needs the SDK, which is present once
      # this has run (or was already there).
      - name: Ensure the iOS platform is installed (best-effort)
        run: xcodebuild -downloadPlatform iOS || true
      - name: Verify Swift version
        run: |
          version="$(swift --version 2>&1)"
          echo "$version"
          echo "$version" | grep -qE 'Swift version 6\.4(\.[0-9]+)?([[:space:]]|$)' || { echo "::error::Expected Swift 6.4.x"; exit 1; }
      - name: Build (iOS)
        # `-skipMacroValidation`: `@Schema` now comes from the JSONFoundation
        # *dependency* (not first-party SwiftMCPMacros), and xcodebuild refuses to
        # run a dependency's macro plugin untrusted in non-interactive CI. The
        # other jobs use `swift build`, which trusts package macros by default.
        run: xcodebuild -scheme SwiftMCP -destination 'generic/platform=iOS' -skipMacroValidation build

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: swift:6.4.2-jammy
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: |
          version="$(swift --version 2>&1)"
          echo "$version"
          echo "$version" | grep -qE 'Swift version 6\.4(\.[0-9]+)?([[:space:]]|$)' || { echo "::error::Expected Swift 6.4.x"; exit 1; }
      - name: Build (Linux)
        run: swift build --build-system swiftbuild --build-tests -v
      - name: Test (Linux)
        run: swift test --build-system swiftbuild -v --skip-build

  # Windows runs in two parts within a single job:
  #
  # 1. Real, enforced (no `continue-on-error`): the NIO-free configuration
  #    (`Server` trait off, so no swift-nio in the graph — the server demo CLIs
  #    are gated `#if Server` and compile to a no-op stub) builds AND tests on
  #    Windows today. If swift-nio ever leaks back into the core/client, or a
  #    non-server test regresses on Windows, these steps fail the job.
  #
  # 2. Aspirational (`continue-on-error`): the full, default-traits build pulls
  #    swift-nio (NIOPosix), which does not currently compile on Windows
  #    (IPPROTO / Sendable errors in System.swift, Thread.swift,
  #    ThreadWindows.swift — an upstream issue, not in SwiftMCP). These steps
  #    stay visible without failing the job; drop the two `continue-on-error`
  #    flags once swift-nio builds on Windows. See
  #    https://github.com/apple/swift-nio.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4.2"
      - name: Verify Swift version
        shell: pwsh
        run: |
          $version = swift --version
          if ($LASTEXITCODE -ne 0) { throw "swift --version failed ($LASTEXITCODE)" }
          $version
          if (-not ($version | Select-String -Pattern 'Swift version 6\.4(\.[0-9]+)?(\s|$)' -Quiet)) {
            throw "Expected Swift 6.4.x"
          }
      - name: Build SwiftMCP library — Client trait only (no swift-nio)
        run: swift build --build-system swiftbuild --target SwiftMCP --traits Client
      - name: Test — non-server suite (Client + OpenAPI, no swift-nio)
        run: swift test --build-system swiftbuild --traits "Client,OpenAPI"
      - name: Build — full (default traits, with swift-nio)
        run: swift build --build-system swiftbuild --build-tests -v
        continue-on-error: true
      - name: Test — full (default traits)
        run: swift test --build-system swiftbuild -v --skip-build
        continue-on-error: true

  # Trait matrix: the tool/schema core and the `Client` feature must build
  # WITHOUT the `Server` trait, i.e. without swift-nio / swift-crypto /
  # swift-certificates. This keeps the NIO-free configuration green so a
  # client/tools-only consumer (and Windows, below) never regresses. The whole
  # package builds NIO-free too — the server demo CLIs are gated `#if Server`
  # and compile to a no-op stub — so a plain `swift build`/`swift test` with
  # `Server` disabled works, not just `--target SwiftMCP`.
  build-traits:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: swift:6.4.2-jammy
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: |
          version="$(swift --version 2>&1)"
          echo "$version"
          echo "$version" | grep -qE 'Swift version 6\.4(\.[0-9]+)?([[:space:]]|$)' || { echo "::error::Expected Swift 6.4.x"; exit 1; }
      - name: Build SwiftMCP library — core only (all traits disabled)
        run: swift build --build-system swiftbuild --target SwiftMCP --disable-default-traits
      - name: Build SwiftMCP library — Client trait only (no swift-nio)
        run: swift build --build-system swiftbuild --target SwiftMCP --traits Client
      - name: Build whole package — Client + OpenAPI (no swift-nio)
        run: swift build --build-system swiftbuild --traits "Client,OpenAPI"
      - name: Test — non-server suite (Client + OpenAPI, no swift-nio)
        run: swift test --build-system swiftbuild --traits "Client,OpenAPI"

  # A normal Android run (build + emulator boot + test) finishes in ~8 min. But
  # when a test FAILS, swift-android-action's emulator teardown can hang
  # (`adb emu kill` → "stop: Not implemented"), so a fast test failure would
  # otherwise run out the whole job timeout and report as a confusing
  # "cancelled". Bound the action with a step-level timeout so a failure (or a
  # hung teardown) surfaces as a red check in ~15 min, and keep the job timeout
  # just above it.
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # The emulator is killed as soon as the test step fails, taking a crash's
      # only record (logcat) with it, and the test process's exit code 1 carries
      # no text (#268). Stream logcat to a file from the moment the emulator
      # appears so a failed run can print what the process died of.
      - name: Capture emulator logcat
        run: |
          adb=/usr/local/lib/android/sdk/platform-tools/adb
          setsid nohup sh -c "$adb wait-for-device && $adb logcat -v time" \
            > "$RUNNER_TEMP/android-logcat.txt" 2>&1 < /dev/null &
      - name: Build & test (Android emulator)
        timeout-minutes: 15
        uses: skiptools/swift-android-action@v2
        with:
          # Swift 6.3's SwiftBuild backend emits an incompatible Android target
          # triple. Use the matching 6.4 host toolchain and Android SDK.
          # https://github.com/swiftlang/swift-build/issues/1167
          # 6.4.2, not 6.4.1: ubuntu-latest is now 26.04, and 6.4.1 has no
          # ubuntu26.04 host toolchain (the download 404s).
          swift-version: "6.4.2"
          # Use the backend that fixes macro-dependent Android test discovery (SwiftPM #8094).
          swift-build-flags: --build-system swiftbuild
          # Test flags reach both XCTest and Swift Testing; XCTest rejects
          # --verbose before the Swift Testing invocation can run.
          free-disk-space: true
      - name: Android logcat after failure
        if: failure()
        run: |
          echo "== crash-related logcat =="
          grep -E "FATAL|Fatal error|signal [0-9]+|SIGABRT|SIGSEGV|SIGKILL|lowmemorykiller|Out of memory|am_kill|DEBUG +:" \
            "$RUNNER_TEMP/android-logcat.txt" | tail -n 200 || true
          echo "== last 150 logcat lines =="
          tail -n 150 "$RUNNER_TEMP/android-logcat.txt" || true
      # The action installs its own host compiler without adding it to PATH.
      # Verify that compiler, rather than the runner's preinstalled Swift.
      - name: Verify Swift version
        run: |
          version="$("$SWIFT_INSTALLATION/bin/swift" --version 2>&1)"
          echo "$version"
          echo "$version" | grep -qE 'Swift version 6\.4(\.[0-9]+)?([[:space:]]|$)' || { echo "::error::Expected Swift 6.4.x"; exit 1; }
